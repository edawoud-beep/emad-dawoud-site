name: تحديث مقالات عماد داود

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  update-articles:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل الموقع
        uses: actions/checkout@v4

      - name: جمع المقالات
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET

          queries = [
              '"عماد داود"',
              '"عماد داود" كاتب',
              '"عماد داود" صحفي',
              '"عماد داود" الأردن'
          ]

          articles = {}

          for query in queries:
              url = "https://news.google.com/rss/search?" + urllib.parse.urlencode({
                  "q": query,
                  "hl": "ar",
                  "gl": "JO",
                  "ceid": "JO:ar"
              })

              try:
                  request = urllib.request.Request(
                      url,
                      headers={"User-Agent": "Mozilla/5.0"}
                  )

                  data = urllib.request.urlopen(
                      request,
                      timeout=30
                  ).read()

                  root = ET.fromstring(data)

                  for item in root.findall(".//item"):

                      title = (item.findtext("title") or "").strip()
                      link = (item.findtext("link") or "").strip()
                      date = (item.findtext("pubDate") or "").strip()
                      source = (item.findtext("source") or "").strip()

                      if not title or not link:
                          continue

                      key = re.sub(
                          r"\s+",
                          " ",
                          title
                      ).strip().casefold()

                      articles.setdefault(
                          key,
                          {
                              "title": title,
                              "link": link,
                              "source": source,
                              "date": date
                          }
                      )

              except Exception as error:
                  print("تعذر البحث:", query, error)

          result = list(articles.values())

          result.sort(
              key=lambda article: article.get("date", ""),
              reverse=True
          )

          os.makedirs("data", exist_ok=True)

          with open(
              "data/articles.json",
              "w",
              encoding="utf-8"
          ) as file:
              json.dump(
                  result,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "تم إنشاء data/articles.json وعدد النتائج:",
              len(result)
          )
          PY

      - name: التحقق من الملف
        run: |
          test -s data/articles.json
          python3 -m json.tool data/articles.json > /dev/null
          echo "الملف سليم وجاهز للنشر"

      - name: حفظ التحديث في GitHub
        run: |
          git config user.name "Emad Dawoud Bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/articles.json

          if git diff --cached --quiet; then
            echo "لا توجد تغييرات جديدة"
          else
            git commit -m "تحديث مقالات عماد داود"
            git push
          fi
