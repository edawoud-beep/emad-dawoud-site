name: تحديث تلقائي للمقالات

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-articles:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل الكود
        uses: actions/checkout@v4

      - name: إعداد Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: تثبيت المكتبات
        run: pip install feedparser requests

      - name: تشغيل السكربت
        run: |
          python3 << 'EOF'
          import json
          import feedparser
          from datetime import datetime

          try:
              with open('data/articles.json', 'r', encoding='utf-8') as f:
                  existing = json.load(f)
          except:
              existing = []

          existing_titles = {article['title'] for article in existing}
          new_articles = []

          queries = ['"عماد داود"', '"عماد داود" كاتب', '"عماد داود" صحفي']
          for query in queries:
              try:
                  url = f"https://news.google.com/rss/search?q={query}&hl=ar&gl=JO&ceid=JO:ar"
                  feed = feedparser.parse(url)
                  for entry in feed.entries[:10]:
                      title = entry.title
                      if title not in existing_titles:
                          new_articles.append({
                              'title': title,
                              'link': entry.link,
                              'source': entry.source.title if 'source' in entry else 'خبرني',
                              'date': entry.published if 'published' in entry else datetime.now().isoformat(),
                              'cat': 'عام'
                          })
                          existing_titles.add(title)
              except Exception as e:
                  print(f'خطأ: {e}')

          sites = ['khaberni.com', 'raialyoum.com', 'nabaajordan.com']
          for site in sites:
              try:
                  url = f"https://news.google.com/rss/search?q=site:{site}+%22عماد+داود%22&hl=ar&gl=JO&ceid=JO:ar"
                  feed = feedparser.parse(url)
                  for entry in feed.entries[:5]:
                      title = entry.title
                      if title not in existing_titles:
                          new_articles.append({
                              'title': title,
                              'link': entry.link,
                              'source': site.split('.')[0].capitalize(),
                              'date': entry.published if 'published' in entry else datetime.now().isoformat(),
                              'cat': 'عام'
                          })
                          existing_titles.add(title)
              except Exception as e:
                  print(f'خطأ: {e}')

          if new_articles:
              existing.extend(new_articles)
              existing.sort(key=lambda x: x.get('date', ''), reverse=True)
              with open('data/articles.json', 'w', encoding='utf-8') as f:
                  json.dump(existing, f, ensure_ascii=False, indent=2)
              print(f'✅ تم إضافة {len(new_articles)} مقالة جديدة!')
          else:
              print('ℹ️ لا توجد مقالات جديدة.')
          EOF

      - name: رفع التغييرات
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/articles.json
          git diff --staged --quiet || git commit -m "تحديث تلقائي للمقالات - $(date)"
          git push
