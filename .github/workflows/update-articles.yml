name: تحديث أرشيف مقالات عماد داود

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  update-articles:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل الموقع
        uses: actions/checkout@v4

      - name: إعداد Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: جمع المقالات من نتائج الأخبار
        shell: bash
        run: |
          python3 <<'PY'
          import json
          import os
          import re
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timedelta, timezone

          FILE = "data/articles.json"

          # صيغ البحث باسم الكاتب
          queries = [
              '"عماد داود"',
              '"عماد داود" كاتب',
              '"عماد داود" صحفي',
              '"عماد داود" الأردن',
              '"عماد داود" مقال',
              '"بقلم عماد داود"',
              '"بقلم: عماد داود"',
              '"الكاتب عماد داود"',
              '"الصحفي عماد داود"'
          ]

          # مصادر ظهرت فيها مقالات الكاتب
          known_domains = [
              "khaberni.com",
              "akhbarna.net",
              "nabaajordan.com",
              "panet.com",
              "ahlan.co.il"
          ]

          articles = {}

          # قراءة الأرشيف القديم أولاً
          if os.path.exists(FILE):
              try:
                  with open(FILE, "r", encoding="utf-8") as f:
                      old = json.load(f)

                  if isinstance(old, list):
                      for article in old:
                          if not isinstance(article, dict):
                              continue

                          title = (article.get("title") or "").strip()
                          link = (article.get("link") or "").strip()

                          if title and link:
                              key = re.sub(r"\s+", " ", title).strip().casefold()
                              articles[key] = article

              except Exception as error:
                  print("تعذر قراءة الأرشيف القديم:", error)

          def add_article(title, link, source, date=""):
              title = re.sub(r"\s+", " ", title or "").strip()
              link = (link or "").strip()
              source = (source or "").strip()
              date = (date or "").strip()

              if not title or not link:
                  return

              # استبعاد نتائج واضحة بأنها ليست مقالات
              bad_words = [
                  "وظيفة",
                  "طقس",
                  "وفيات",
                  "نتائج التوجيهي",
                  "سعر الذهب"
              ]

              if any(word in title for word in bad_words):
                  return

              key = title.casefold()

              # منع التكرار حسب العنوان
              if key not in articles:
                  articles[key] = {
                      "title": title,
                      "link": link,
                      "source": source,
                      "date": date,
                      "author": "عماد داود"
                  }

          def search_google_news(query):
              url = "https://news.google.com/rss/search?" + urllib.parse.urlencode({
                  "q": query,
                  "hl": "ar",
                  "gl": "JO",
                  "ceid": "JO:ar"
              })

              try:
                  request = urllib.request.Request(
                      url,
                      headers={"User-Agent": "Mozilla/5.0"}
                  )

                  data = urllib.request.urlopen(
                      request,
                      timeout=30
                  ).read()

                  root = ET.fromstring(data)

                  for item in root.findall(".//item"):
                      title = item.findtext("title") or ""
                      link = item.findtext("link") or ""
                      date = item.findtext("pubDate") or ""
                      source = item.findtext("source") or ""

                      add_article(
                          title,
                          link,
                          source,
                          date
                      )

              except Exception as error:
                  print("خطأ في Google News:", query, error)

          # البحث العام
          for query in queries:
              search_google_news(query)

          # البحث المخصص بالمواقع التي تم اكتشافها
          for domain in known_domains:
              for query in [
                  f'"عماد داود" site:{domain}',
                  f'"بقلم عماد داود" site:{domain}'
              ]:
                  search_google_news(query)

          # تحويل النتائج إلى قائمة
          result = list(articles.values())

          # ترتيب النتائج
          result.sort(
              key=lambda article: (
                  article.get("date") or "",
                  article.get("title") or ""
              ),
              reverse=True
          )

          os.makedirs("data", exist_ok=True)

          with open(FILE, "w", encoding="utf-8") as f:
              json.dump(
                  result,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("===================================")
          print("تم تحديث أرشيف عماد داود")
          print("عدد النتائج:", len(result))
          print("===================================")
          PY

      - name: التحقق من الأرشيف
        run: |
          test -f data/articles.json
          python3 -m json.tool data/articles.json > /dev/null
          echo "✓ articles.json صالح"

      - name: عرض عدد المقالات
        run: |
          python3 - <<'PY'
          import json

          with open("data/articles.json", encoding="utf-8") as f:
              articles = json.load(f)

          print("عدد المقالات/النتائج المحفوظة:", len(articles))
          PY

      - name: حفظ التحديث
        run: |
          git config user.name "Emad Dawoud Archive Bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/articles.json

          if git diff --cached --quiet; then
            echo "لا توجد مقالات جديدة."
          else
            git commit -m "تحديث أرشيف مقالات عماد داود"
            git pull origin main --rebase
            git push
          fi
