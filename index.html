<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عماد داود | الكاتب والصحفي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Cairo', sans-serif; background: #f0f4fa; color: #1e2a41; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; }
        
        .header {
            background: linear-gradient(135deg, #0a1a3a, #1a3b6b);
            color: white;
            padding: 40px 20px;
            border-radius: 30px;
            text-align: center;
            margin-bottom: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .profile-avatar {
            width: 120px; height: 120px; border-radius: 50%;
            border: 4px solid #f7c948;
            margin-bottom: 15px;
        }
        .header h1 { font-size: 3rem; }
        .header h1 span { color: #f7c948; }
        .subtitle { font-size: 1.4rem; color: #ddd; margin-top: 5px; border-top: 2px solid #f7c948; display: inline-block; padding-top: 10px; }
        .stats { display: flex; justify-content: center; gap: 30px; margin-top: 20px; flex-wrap: wrap; }
        .stats div { background: rgba(255,255,255,0.1); padding: 8px 20px; border-radius: 40px; }

        .social-bar {
            background: white; padding: 15px 25px; border-radius: 60px;
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 30px; box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            flex-wrap: wrap;
        }
        /* أيقونات التواصل الاجتماعي (نصية ومضمونة الظهور 100%) */
        .social-links a {
            background: #f0f4fa; width: 45px; height: 45px;
            display: inline-flex; align-items: center; justify-content: center;
            border-radius: 50%; margin: 0 5px; color: #1a3b6b;
            text-decoration: none; font-size: 1.3rem; font-weight: bold;
            transition: 0.3s;
            border: 1px solid #e0e7ef;
        }
        .social-links a:hover { background: #1a3b6b; color: white; transform: translateY(-3px); }

        .grid-title { font-size: 1.8rem; font-weight: 700; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .grid-title span { background: #1a3b6b; color: #f7c948; padding: 8px 15px; border-radius: 15px; }
        .articles-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }

        .card {
            background: white; border-radius: 20px; padding: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.04);
            border-right: 5px solid #f7c948;
            transition: 0.3s;
        }
        .card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.08); }
        .card .source { color: #1a3b6b; font-weight: 700; font-size: 0.85rem; }
        .card h3 { margin: 10px 0; font-size: 1.2rem; }
        .card h3 a { text-decoration: none; color: #0a1a3a; }
        .card .date { color: #94a3b8; font-size: 0.9rem; }

        .footer { text-align: center; margin-top: 40px; padding-top: 20px; border-top: 1px solid #ddd; color: #94a3b8; }
    </style>
</head>
<body>
<div class="container">

    <div class="header">
        <img src="https://ui-avatars.com/api/?name=عماد+داود&size=120&background=1a3b6b&color=f7c948&bold=true" alt="عماد داود" class="profile-avatar">
        <h1>عماد <span>داود</span></h1>
        <div class="subtitle">✍️ كاتب وصحفي</div>
        <div class="stats">
            <div>📰 <span id="countDisplay">5</span> مقال</div>
            <div>📅 محدث يومياً</div>
        </div>
    </div>

    <div class="social-bar">
        <div>🔄 آخر تحديث: <span id="updateDate">اليوم</span></div>
        <div class="social-links">
            <a href="#" title="فيسبوك">ف</a>
            <a href="#" title="تويتر">ت</a>
            <a href="#" title="إنستغرام">إن</a>
            <a href="#" title="يوتيوب">ي</a>
        </div>
    </div>

    <div class="grid-title"><span>📂</span> أرشيف المقالات</div>
    <div class="articles-grid" id="articlesGrid">
        <!-- سيتم ملؤها بواسطة الجافا سكريبت -->
    </div>

    <div class="footer">جميع الحقوق محفوظة © عماد داود</div>
</div>

<script>
    // مقالات افتراضية جاهزة (تظهر فوراً بدون أي ملف خارجي)
    const articles = [
        { title: "دور الصحافة في نقل الحقيقة", source: "مقالات عماد داود", date: "2026-08-24" },
        { title: "كتابات في الشأن الأردني", source: "مقالات عماد داود", date: "2026-08-23" },
        { title: "أهمية التوثيق الإعلامي", source: "مقالات عماد داود", date: "2026-08-22" },
        { title: "رؤية صحفية حول الأحداث", source: "مقالات عماد داود", date: "2026-08-21" },
        { title: "كلمات في الوطنية والإعلام", source: "مقالات عماد داود", date: "2026-08-20" }
    ];

    const grid = document.getElementById('articlesGrid');
    const countDisplay = document.getElementById('countDisplay');
    const updateDate = document.getElementById('updateDate');

    // عرض التاريخ
    const now = new Date();
    updateDate.textContent = now.toLocaleDateString('ar-EG', { year: 'numeric', month: 'long', day: 'numeric' });

    // عرض عدد المقالات
    countDisplay.textContent = articles.length;

    // عرض المقالات
    articles.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
            <div class="source">🌐 ${item.source}</div>
            <h3><a href="#">${item.title}</a></h3>
            <div class="date">📅 ${item.date}</div>
        `;
        grid.appendChild(card);
    });
</script>
</body>
</html>
