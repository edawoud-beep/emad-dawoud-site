<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عماد داود | كاتب وصحفي — الأرشيف الرسمي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Cairo', sans-serif; background: #f0f4fa; color: #1e2a41; padding: 24px 16px; }
        .container { max-width: 1200px; margin: 0 auto; }

        .header {
            background: linear-gradient(145deg, #0a1a3a 0%, #1a3b6b 100%);
            color: white;
            padding: 48px 32px 40px;
            border-radius: 28px;
            margin-bottom: 32px;
            box-shadow: 0 24px 48px -12px rgba(10,26,58,0.45);
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .header::before {
            content: "✍";
            position: absolute;
            font-size: 180px;
            left: -20px;
            top: -30px;
            opacity: 0.04;
            transform: rotate(-12deg);
            pointer-events: none;
        }
        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 4px solid #f7c948;
            margin: 0 auto 16px;
            display: block;
            box-shadow: 0 8px 24px rgba(0,0,0,0.35);
        }
        .header h1 { font-size: clamp(2rem, 6vw, 3.6rem); font-weight: 900; letter-spacing: 1px; }
        .header h1 span { color: #f7c948; }
        .header .tagline {
            font-size: 1.1rem;
            opacity: 0.88;
            margin-top: 10px;
            border-top: 1px solid rgba(247,201,72,0.25);
            padding-top: 14px;
        }
        .badge {
            display: inline-block;
            background: #e74c3c;
            color: #fff;
            padding: 3px 14px;
            border-radius: 40px;
            font-size: 0.82rem;
            font-weight: 700;
            margin-right: 10px;
            vertical-align: middle;
            animation: pulse 2.2s infinite;
        }
        @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.06)} }
        .stats {
            display: inline-flex;
            gap: 32px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            padding: 10px 28px;
            border-radius: 60px;
            margin-top: 18px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .stats span { font-size: 0.95rem; }

        .social-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            background: white;
            padding: 12px 24px;
            border-radius: 60px;
            margin-bottom: 36px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.05);
            border: 1px solid #e8eef6;
        }
        .update-time { font-weight: 700; color: #1a3b6b; font-size: 0.9rem; }
        .dot { color: #22c55e; margin-left: 6px; font-size: 10px; }
        .social-links a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #f0f4fa;
            color: #1a3b6b;
            font-weight: 900;
            font-size: 1rem;
            border: 1px solid #dde5f0;
            text-decoration: none;
            margin: 0 3px;
            transition: 0.25s;
        }
        .social-links a:hover { background: #1a3b6b; color: white; transform: translateY(-3px); }

        .filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 28px; }
        .filter-btn {
            padding: 7px 20px;
            border-radius: 40px;
            border: 2px solid #dde5f0;
            background: white;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 0.88rem;
            color: #1a3b6b;
            transition: 0.22s;
        }
        .filter-btn.active, .filter-btn:hover { background: #0a1a3a; color: #f7c948; border-color: #0a1a3a; }

        .section-title {
            font-size: 1.8rem;
            font-weight: 900;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .section-title .icon-box {
            background: #0a1a3a;
            color: #f7c948;
            padding: 8px 16px;
            border-radius: 14px;
            font-size: 1.3rem;
        }

        .articles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 22px;
        }

        .card {
            background: white;
            border-radius: 22px;
            padding: 24px 20px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.04);
            border: 1px solid rgba(26,59,107,0.06);
            border-right: 5px solid #f7c948;
            display: flex;
            flex-direction: column;
            transition: 0.28s;
        }
        .card:hover { transform: translateY(-7px); box-shadow: 0 18px 40px -10px rgba(10,26,58,0.14); }
        .card .meta-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }
        .source-badge {
            font-size: 0.72rem;
            background: #eef2fb;
            padding: 4px 12px;
            border-radius: 30px;
            color: #1a3b6b;
            font-weight: 700;
        }
        .category-tag { font-size: 0.7rem; padding: 3px 10px; border-radius: 20px; font-weight: 700; }
        .tag-siyasi   { background:#dbeafe; color:#1d4ed8; }
        .tag-sakher   { background:#fef3c7; color:#b45309; }
        .tag-iqtisadi { background:#dcfce7; color:#166534; }

        .card h3 { font-size: 1.12rem; font-weight: 700; line-height: 1.65; margin-bottom: 10px; flex-grow: 1; color: #0a1a3a; }
        .card .excerpt {
            font-size: 0.84rem;
            color: #64748b;
            line-height: 1.7;
            margin-bottom: 14px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .card .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 14px;
            border-top: 1px solid #f0f4fa;
            font-size: 0.82rem;
            color: #94a3b8;
        }
        .read-more {
            background: #0a1a3a;
            color: white;
            padding: 6px 16px;
            border-radius: 40px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.78rem;
            transition: 0.22s;
        }
        .read-more:hover { background: #f7c948; color: #0a1a3a; }

        .footer {
            margin-top: 56px;
            text-align: center;
            padding: 20px;
            color: #94a3b8;
            border-top: 1px solid #e2e8f0;
            font-size: 0.88rem;
        }
        .footer a { color: #1a3b6b; text-decoration: none; font-weight: 700; }

        @media (max-width: 600px) {
            .stats { gap: 16px; }
            .header { padding: 32px 20px; }
        }
    </style>
</head>
<body>
<div class="container">

    <header class="header">
        <img src="https://ui-avatars.com/api/?name=عماد+داود&size=220&background=1a3b6b&color=f7c948&bold=true&font-size=0.45&rounded=true" alt="عماد داود" class="avatar">
        <h1>عماد <span>داود</span></h1>
        <p class="tagline">
            <span class="badge">نسخة 5.0</span>
            كاتب وصحفي أردني
        </p>
        <div class="stats">
            <span>📰 <strong id="articleCount">0</strong> مقال</span>
            <span>🗓 محدّث يومياً</span>
            <span>🌍 خبرني · رأي اليوم</span>
        </div>
    </header>

    <div class="social-bar">
        <div class="update-time">
            <span class="dot">●</span>
            آخر تحديث: <span id="lastUpdate"></span>
        </div>
        <div class="social-links">
            <a href="mailto:emadawoud@yahoo.com" title="البريد الإلكتروني">✉</a>
            <a href="https://emad-dawoud.netlify.app/" title="الموقع الرسمي" target="_blank">🌐</a>
            <a href="#" title="فيسبوك">ف</a>
            <a href="#" title="تويتر/X">X</a>
        </div>
    </div>

    <div class="filters" id="filters">
        <button class="filter-btn active" data-cat="all">الكل</button>
        <button class="filter-btn" data-cat="siyasi">سياسي</button>
        <button class="filter-btn" data-cat="sakher">ساخر</button>
        <button class="filter-btn" data-cat="iqtisadi">اقتصادي</button>
    </div>

    <div class="section-title">
        <span class="icon-box">📂</span>
        أرشيف المقالات
    </div>

    <div class="articles-grid" id="articlesContainer"></div>

    <footer class="footer">
        جميع الحقوق محفوظة © عماد داود ·
        <a href="mailto:emadawoud@yahoo.com">emadawoud@yahoo.com</a> ·
        <a href="https://emad-dawoud.netlify.app/" target="_blank">الموقع الرسمي</a>
    </footer>

</div>

<script>
const articles = [
    {
        title: "جعفر حسان وعبد الرؤوف الكسم... ماذا تفعل الدولة برئيس حكومتها؟",
        excerpt: "الباب وحده يكشف الدولة. ليس الدستور ولا الخطاب ولا الصورة الرسمية. لأن الدولة الحقيقية هي التي تعرف أين ينتهي بابها وأين يبدأ باب جارها.",
        source: "خبرني", date: "2026-08-18", cat: "siyasi",
        url: "https://www.khaberni.com"
    },
    {
        title: "كشرتنا طلعت عالمية! — 46% زعلانين وأبو غزالة وزير السعادة",
        excerpt: "تشاد أولاً. الأردن ثانياً. نقطة واحدة فقط تفصلنا عن صدارة الزعل العالمي. الكشرة ليست طبعاً — هي تقرير. وقد يكون الوجه أول تقرير يكتبه الواقع.",
        source: "رأي اليوم", date: "2026-08-20", cat: "sakher",
        url: "#"
    },
    {
        title: "الاجتماع",
        excerpt: "في البدء كانت الفكرة. ثم كان القرار. ثم كان الاجتماع ليناقش القرار الذي اتُّخذ قبل الاجتماع. وهكذا بدأت الحضارة تأكل نفسها.",
        source: "رأي اليوم", date: "2026-08-10", cat: "sakher",
        url: "#"
    },
    {
        title: "الليمونة كشفتنا!",
        excerpt: "الدولة التي تسأل ماذا حدث تختلف اختلافاً جذرياً عن الدولة التي تسأل ماذا سيحدث. الأولى تدير الأزمة. الثانية تصنع القرار. والفارق بينهما أحياناً حبة ليمون.",
        source: "خبرني", date: "2026-08-22", cat: "iqtisadi",
        url: "https://www.khaberni.com"
    },
    {
        title: "قنواتنا الوطنية ونظرية يلا تنام!",
        excerpt: "هناك طبيبان: الأول يقرأ النتائج كما هي ويقول لك ما لا تريد سماعه. يؤلمك لكنه يعالجك. الثاني يربت على كتفك ويقول خذ مسكناً وارتح.",
        source: "خبرني", date: "2026-07-28", cat: "siyasi",
        url: "https://www.khaberni.com"
    },
    {
        title: "المواطن الذي لا يسأل لا يحمي الدولة — يحمي من يسرقها",
        excerpt: "الفرق بين مؤسسة تنتج ومؤسسة تجتمع ليس في الميزانية ولا في الكوادر. الفرق في سؤال واحد: هل قرار اليوم أسرع من اجتماع الأمس؟",
        source: "خبرني", date: "2026-08-12", cat: "siyasi",
        url: "https://www.khaberni.com"
    }
];

const container = document.getElementById('articlesContainer');
const countSpan  = document.getElementById('articleCount');
const updateSpan = document.getElementById('lastUpdate');

countSpan.textContent = articles.length;
const now = new Date();
updateSpan.textContent = now.toLocaleDateString('ar-EG', { year:'numeric', month:'long', day:'numeric' });

const tagMap = {
    siyasi:   { label:'سياسي',   cls:'tag-siyasi' },
    sakher:   { label:'ساخر',    cls:'tag-sakher' },
    iqtisadi: { label:'اقتصادي', cls:'tag-iqtisadi' }
};

function buildCards(cat) {
    container.innerHTML = '';
    const list = cat === 'all' ? articles : articles.filter(a => a.cat === cat);
    list.forEach(item => {
        const tag = tagMap[item.cat];
        let dateStr = item.date;
        try {
            dateStr = new Date(item.date).toLocaleDateString('ar-EG', { year:'numeric', month:'short', day:'numeric' });
        } catch(e) {}
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
            <div class="meta-top">
                <span class="source-badge">🌐 ${item.source}</span>
                <span class="category-tag ${tag.cls}">${tag.label}</span>
            </div>
            <h3>${item.title}</h3>
            <p class="excerpt">${item.excerpt}</p>
            <div class="card-footer">
                <span>📅 ${dateStr}</span>
                <a href="${item.url}" target="_blank" class="read-more">قراءة →</a>
            </div>
        `;
        container.appendChild(card);
    });
}

buildCards('all');

document.getElementById('filters').addEventListener('click', e => {
    if (!e.target.matches('.filter-btn')) return;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    buildCards(e.target.dataset.cat);
});
</script>
</body>
</html>
