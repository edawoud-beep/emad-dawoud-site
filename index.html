    const filterContainer = document.getElementById('filterContainer');

    function renderArticles(cat = 'all') {
        container.innerHTML = '';
        const filtered = cat === 'all' ? articlesData : articlesData.filter(a => a.cat === cat);
        if (!filtered.length) {
            container.innerHTML = '<p style="text-align:center;">لا توجد مقالات في هذا التصنيف.</p>';
            return;
        }
        filtered.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <h3><a href="${item.link}" target="_blank">${item.title}</a></h3>
                <p>المصدر: ${item.source} | التاريخ: ${item.date}</p>
            `;
            container.appendChild(card);
        });
    }

    renderArticles('all');

    filterContainer.addEventListener('click', e => {
        if (!e.target.matches('button')) return;
        document.querySelectorAll('.filter button').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        renderArticles(e.target.dataset.cat);
    });
